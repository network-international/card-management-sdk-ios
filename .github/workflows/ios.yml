name: iOS CI

on:
  push:
    branches: [main, "releases/**"]
  pull_request:
    branches: [main, "releases/**"]

jobs:
  build:
    name: Build default scheme (iPhone simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth + resolve private Core SPM
        id: core
        env:
          CORE_GITHUB_TOKEN: ${{ secrets.CORE_GITHUB_TOKEN }}
        run: |
          if [ -z "${CORE_GITHUB_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CORE_GITHUB_TOKEN not set — skipping build (forks/PRs without maintainer secret)."
            echo "Maintainer: add a PAT with read access to akiselevn/card-management-sdk-core as CORE_GITHUB_TOKEN."
            exit 0
          fi
          git config --global url."https://x-access-token:${CORE_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          swift package resolve
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Set Default Scheme
        if: steps.core.outputs.available == 'true'
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo "$scheme_list" | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo "$default" > default
          echo "Using default scheme: $default"

      - name: Build
        if: steps.core.outputs.available == 'true'
        env:
          platform: iOS Simulator
        run: |
          scheme=$(cat default)
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")
          if [ -n "$(ls -A | grep -i '\.xcworkspace$')" ]; then
            filetype_parameter=workspace
            file_to_build=$(ls -A | grep -i '\.xcworkspace$' | head -1)
          else
            filetype_parameter=project
            file_to_build=$(ls -A | grep -i '\.xcodeproj$' | head -1)
          fi
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device"

      - name: Build Example (CocoaPods + Core XCFramework)
        if: steps.core.outputs.available == 'true'
        env:
          CORE_GITHUB_TOKEN: ${{ secrets.CORE_GITHUB_TOKEN }}
        run: |
          bash scripts/fetch-core-xcframework.sh
          gem install cocoapods --no-document
          cd Example
          pod install
          device=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | sed -E 's/^[[:space:]]*([^(]+).*/\1/' | sed 's/[[:space:]]*$//')
          xcodebuild \
            -workspace CardManagementSDKSwiftSample.xcworkspace \
            -scheme CardManagementSDKSwiftSample \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${device}" \
            CODE_SIGNING_ALLOWED=NO \
            build
